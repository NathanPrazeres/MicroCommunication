---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service
  namespace: app
  labels:
    app: ui-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui-service
  template:
    metadata:
      labels:
        app: ui-service
    spec:
      containers:
      - name: ui-service
        image: nathanprazeres/agisit-ui-service:latest
        ports:
        - containerPort: 4173
          name: http
        volumeMounts:
        - name: config
          mountPath: /app/dist/config.json
          subPath: config.json
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: 4173
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 4173
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m
      volumes:
      - name: config
        configMap:
          name: ui-service-config
