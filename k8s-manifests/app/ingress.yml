---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # traefik.ingress.kubernetes.io/router.middlewares: traefik-cors-headers@kubernetescrd,traefik-security-headers@kubernetescrd
    argocd.argoproj.io/sync-wave: "2"
spec:
  ingressClassName: traefik
  rules:
    - http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: ui-service
              port:
                number: 80
