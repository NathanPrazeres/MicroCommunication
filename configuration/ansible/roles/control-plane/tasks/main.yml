---
- include_tasks: setup.yml

- name: Install Kubernetes packages
  package:
    name: "{{ kubernetes_packages }}"
    state: "{{ kubernetes_packages_state }}"
  notify: restart kubelet
  with_items: "{{ kubernetes_packages }}"

- include_tasks: sysctl-setup.yml

- name: Ensure kubelet is started and enabled at boot.
  service:
    name: kubelet
    state: started
    enabled: true

- name: Check if Kubernetes has already been initialized.
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubernetes_init_stat

- include_tasks: control-plane-setup.yml

- name: Ensure a non-expiring kubeadm token exists
  command: kubeadm token create --ttl 0 --description "ansible-bootstrap"
  register: kubeadm_token
  changed_when: "'token already exists' not in kubeadm_token.stderr"
  run_once: true

- name: Build kubeadm join command
  set_fact:
    kubeadm_join_command: >
      kubeadm join {{ kube_control_plane_endpoint }}:6443
      --token {{ kubeadm_token.stdout }}
  delegate_to: localhost
  run_once: true
