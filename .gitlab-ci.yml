stages:
  - validate
  - infrastructure
  - provision

variables:
  PRE_COMMIT_COLOR: always
  TF_ROOT: ${CI_PROJECT_DIR}/terraform
  ANSIBLE_ROOT: ${CI_PROJECT_DIR}/ansible
  GCP_PROJECT_ID: "agisit-g20"
  GCP_REGION: "europe-southwest1"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - when: manual

# ==================== VALIDATE STAGE ====================
terraform:validate:
  stage: validate
  image: hashicorp/terraform:latest
  before_script:
    - cd $TF_ROOT
    - terraform init -backend=false
  script:
    - terraform fmt -check
    - terraform validate
  rules:
    - changes:
        - terraform/**/*

# ansible:lint:
#   stage: validate
#   image: cytopia/ansible-lint:latest
#   script:
#     - cd $ANSIBLE_ROOT
#     - ansible-lint playbooks/*.yml
#   rules:
#     - changes:
#         - ansible/**/*

ansible:lint:
  stage: validate
  script:
    - pre-commit install
    - pre-commit run --all-files
  rules:
    - changes:
        - ansible/**/*

# ==================== INFRASTRUCTURE STAGE ====================
terraform:plan:
  stage: infrastructure
  image: hashicorp/terraform:latest
  before_script:
    - cd $TF_ROOT
    # Authenticate to GCP using service account key stored in GitLab CI/CD variables
    - echo "$GCP_SERVICE_ACCOUNT_KEY" > ${CI_PROJECT_DIR}/gcp-key.json
    - export GOOGLE_APPLICATION_CREDENTIALS=${CI_PROJECT_DIR}/gcp-key.json
    - terraform init
  script:
    - terraform plan -out=tfplan
    - terraform show -json tfplan > tfplan.json
  artifacts:
    paths:
      - $TF_ROOT/tfplan
      - $TF_ROOT/tfplan.json
    expire_in: 1 week
  only:
    - main
    - merge_requests

terraform:apply:
  stage: infrastructure
  image: hashicorp/terraform:latest
  before_script:
    - cd $TF_ROOT
    - echo "$GCP_SERVICE_ACCOUNT_KEY" > ${CI_PROJECT_DIR}/gcp-key.json
    - export GOOGLE_APPLICATION_CREDENTIALS=${CI_PROJECT_DIR}/gcp-key.json
    - terraform init
  script:
    - terraform apply -auto-approve
  only:
    - main
  when: manual  # Require manual approval for infrastructure changes

# ==================== PROVISION STAGE ====================
ansible:provision:
  stage: provision
  image: cytopia/ansible:latest-tools
  dependencies:
    - terraform:apply
  before_script:
    # Fetch SSH key from Google Secret Manager

    # TODO: install gcloud

    - echo "$GCP_SERVICE_ACCOUNT_KEY" > ${CI_PROJECT_DIR}/gcp-key.json
    - export GOOGLE_APPLICATION_CREDENTIALS=${CI_PROJECT_DIR}/gcp-key.json

    - chmod 600 /tmp/ansible_key
    # Add known hosts (important for SSH)
    - mkdir -p ~/.ssh

    # TODO: find a way to keyscan the hosts before connecting
    - ssh-keyscan -H $() >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - cd $ANSIBLE_ROOT
    # Test connectivity first
    - ansible all -i ${CI_PROJECT_DIR}/inventories/inventory.gcp.yml -m ping

    - ansible-playbook -i ${CI_PROJECT_DIR}/inventories/inventory.gcp.yml playbooks/cluster.yml
  only:
    - main
  needs:
    - terraform:apply
