---
# ArgoCD Configuration
install_argocd: true
argocd_manifest_url: "https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml"

# Optional: Configure an ArgoCD Application to sync from your Git repo
# argocd_app_repo: "https://github.com/your-org/your-repo.git"
# argocd_app_path: "kubernetes/apps"
# argocd_app_name: "my-applications"
# argocd_app_namespace: "default"
# argocd_app_revision: "main"
# argocd_auto_prune: true
# argocd_auto_heal: true

# Traefik Configuration
install_traefik: true
traefik_service_type: "NodePort"  # Options: NodePort, LoadBalancer, ClusterIP
traefik_http_nodeport: 30080
traefik_https_nodeport: 30443
