---
global:
  postgresql:
    auth:
      postgresPassword: "admin"  # Change in production!
      username: "admin"
      password: "admin"
      database: "keycloak"

architecture: standalone # replication

primary:
  persistence:
    enabled: false
    # size: 1Gi

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  # Multiple databases
  initdb:
    scripts:
      init-db.sql: |
        -- Create additional databases
        CREATE DATABASE user_service;
        CREATE DATABASE chat_service;

# This section configures your replicated nodes for HA.
# replica:
#   replicaCount: 2
#
#   # IMPORTANT: Replicas should NOT use persistent storage 
#   # for the data directory, as they receive data via streaming replication.
#   persistence:
#     enabled: false
#
#   resources:
#     requests:
#       memory: 256Mi
#       cpu: 250m
#     limits:
#       memory: 512Mi
#       cpu: 500m

image:
  registry: docker.io
  repository: bitnami/postgresql
  tag: "latest"

# Metrics for Prometheus
metrics:
  enabled: true
  entryPoint: metrics
  serviceMonitor:
    enabled: true
    namespace: monitoring

backup:
  enabled: false
