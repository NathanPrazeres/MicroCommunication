---
version: "3.9"

services:
  front-end:
    image:
    container_name: front-end
    restart: unless-stopped
    ports:
      - "8080:80"  # this is just an example
    networks:
      - front-end
      - back-end
    depends_on:
      - user
      - auth
      - message
      - delivery

  user:
    image:
    container_name: user-service
    restart: unless-stopped
    ports:
      - "5001:5000"  # just an example as well
    networks:
      - back-end
    depends_on:
      - db
      - redis

  auth:
    image:
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "5002:5000"
    networks:
      - back-end
    depends_on:
      - db
      - redis

  message:
    image:
    container_name: message-service
    restart: unless-stopped
    ports:
      - "5003:5000"
    networks:
      - back-end
    depends_on:
      - db
      - redis

  delivery:
    image:
    container_name: delivery-service
    restart: unless-stopped
    ports:
      - "5004:5000"
    networks:
      - back-end
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis-service
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - back-end

  db:
    image: postgres:15-alpine
    container_name: db-service
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    networks:
      - back-end

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    # NOTE: let's not hardcode this
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

networks:
  monitoring: {}
  front-end: {}
  back-end: {}
