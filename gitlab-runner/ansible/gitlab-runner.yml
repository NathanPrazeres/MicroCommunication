---
- name: Enable privileged features for GitLab Runner container
  hosts: proxmox
  become: yes

  tasks:
    - name: Enable LXC features (keyctl, nesting, fuse)
      ansible.builtin.command: >
        pct set 118 -features nesting=1,fuse=1,keyctl=1

- name: Deploy and configure GitLab Runner
  hosts: runner
  become: yes

  vars:
    project_root: "~/config"
    docker_install_compose: yes

  roles:
    - role: geerlingguy.docker

  tasks:
    - name: Ensure system is up to date
      ansible.builtin.apt:
        upgrade: dist
        update_cache: yes
      tags:
        - update

    - name: Clean up old containers before a fresh start
      community.docker.docker_compose_v2:
        project_src: "{{ project_root }}"
        state: absent
      ignore_errors: yes

    - name: Ensure required directories exist
      ansible.builtin.file:
        path: "{{ project_root }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Ensure docker-compose plugin is installed
      ansible.builtin.apt:
        name: docker-compose-plugin
        state: present
        update_cache: yes

    - name: Copy docker-compose files and .env to the LXC
      ansible.builtin.copy:
        src: "../{{ item }}"
        dest: "{{ project_root }}/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - docker-compose.yml
        - .env

    - name: Run the docker-compose services
      community.docker.docker_compose_v2:
        project_src: "{{ project_root }}"
        files:
          - docker-compose.yml
        env_files:
          - "{{ project_root }}/.env"
        pull: always
        state: present
