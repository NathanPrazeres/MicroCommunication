---
- name: Create ArgoCD namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd

# - name: Create ArgoCD namespace
#   kubernetes.core.k8s:
#     state: present
#     src: "{{ argocd_manifests_path }}/argocd/namespace.yaml"

# - name: Download ArgoCD installation manifest
#   get_url:
