---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: app
  labels:
    app: chat-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
      - name: chat-service
        image: nathanprazeres/agisit-chat-service:latest
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: PG_HOST
          valueFrom:
            secretKeyRef:
              name: chat-message-secret
              key: postgres-host-secret
        - name: PG_PORT
          valueFrom:
            secretKeyRef:
              name: chat-message-secret
              key: postgres-port-secret
        - name: PG_NAME
          valueFrom:
            secretKeyRef:
              name: chat-message-secret
              key: postgres-name-secret
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: chat-message-secret
              key: postgres-user-secret
        - name: PG_PASS
          valueFrom:
            secretKeyRef:
              name: chat-message-secret
              key: postgres-pass-secret
        - name: REDIS_HOST
          value: redis-master
        - name: REDIS_PORT
          value: "6379"
        - name: USER_HOST
          value: user-service
        - name: USER_PORT
          value: "3000"
        - name: AUTH_HOST
          value: keycloak
        - name: AUTH_PORT
          value: "8080"
        - name: AUTH_REALM
          value: app
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
