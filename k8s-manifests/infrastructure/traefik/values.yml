---
deployment:
  replicas: 1

service:
  type: NodePort # LoadBalancer  # or NodePort for local

ports:
  web:
    port: 80
    expose:
      default: true
    exposedPort: 8080
    protocol: TCP

  # HTTPS entrypoint
  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 8443
    protocol: TCP

  # Dashboard entrypoint
  traefik:
    port: 9000
    expose:
      default: true
    exposedPort: 9000
    protocol: TCP

# Enables the dashboard in Secure Mode
api:
  dashboard: true
  insecure: true

ingressRoute:
  dashboard:
    enabled: true
    entryPoints: ["traefik"]

logs:
  general:
    level: INFO
  access:
    enabled: true

metrics:
  prometheus:
    enabled: true
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      honorLabels: true
      additionalLabels:
        release: kube-prometheus-stack

resources:
  requests:
    cpu: 100m
    memory: 50Mi
  limits:
    cpu: 300m
    memory: 150Mi

autoscaling:
  enabled: true
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
