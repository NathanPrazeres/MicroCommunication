---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    argocd.argoproj.io/managed-by: root
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: redis
      repoURL: https://charts.bitnami.com/bitnami
      targetRevision: 23.1.3
      helm:
        releaseName: redis
        valueFiles:
          - $values/k8s-manifests/platform/redis/values.yml
    - repoURL: git@gitlab.rnl.tecnico.ulisboa.pt:agisit/agisit25-g20.git
      targetRevision: dev
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
