---
deployment:
  replicas: 0

service:
  type: NodePort # LoadBalancer  # or NodePort for local
  # annotations:
  #   cloud.google.com/load-balancer-type: "External"
  # spec:
  #   loadBalancerIP: "IP"

# ports:
#   web:
#     port: 8080
#     expose:
#       default: true
#     exposedPort: 80
#     nodePort: 30000
#     redirections:
#       entryPoint:
#         to: websecure
#         scheme: https
#         permanent: true
#
#   # HTTPS entrypoint
#   websecure:
#     port: 8443
#     expose:
#       default: true
#     exposedPort: 443
#     nodePort: 30001
#     protocol: TCP

# Enables the dashboard in Secure Mode
api:
  dashboard: true
  insecure: true

ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - web
    middlewares:
      - name: dashboard-auth

# Creates a BasiAuth Middleware and Secret for the Dashboard Security
extraObjects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: dashboard-auth-secret
    type: kubernetes.io/basic-auth
    stringData:
      username: admin
      password: "admin"
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: dashboard-auth
    spec:
      basicAuth:
        secret: dashboard-auth-secret

logs:
  general:
    level: INFO
  access:
    enabled: true

metrics:
  prometheus:
    enabled: true
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      honorLabels: true
      additionalLabels:
        release: kube-prometheus-stack

resources:
  requests:
    cpu: 100m
    memory: 50Mi
  limits:
    cpu: 300m
    memory: 150Mi

autoscaling:
  enabled: true
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
