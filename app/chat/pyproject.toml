[project]
name = "chat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard] (>=0.117.1,<0.118.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "redis (>=6.4.0,<7.0.0)",
    "psycopg[pool] (>=3.2.10,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "prometheus-fastapi-instrumentator (>=7.1.0,<8.0.0)",
    "prometheus-client (>=0.23.1,<0.24.0)"
]

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)"
]

[tool.poetry]
package-mode=false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
