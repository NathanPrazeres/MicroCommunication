---
kubernetes_packages:
  - "kubelet"
  - "kubeadm"
  - "kube-proxy"
  - "kubectl"

kubernetes_state: present
kubernetes_version: '1.34' # most recent version as of September 2025

kubernetes_config_file_path: '/etc/kubernetes/config.yaml'

kubernetes_kubeadm_init_extra_opts: ""

kubernetes_ignore_preflight_errors: 'all'

kubernetes_config_kubelet_configuration:
  cgroupDriver: "systemd"

# Flannel config file.
kubernetes_flannel_manifest_file: https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml

# Calico config file.
kubernetes_calico_manifest_file: https://projectcalico.docs.tigera.io/manifests/calico.yaml
