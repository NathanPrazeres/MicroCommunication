---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: app
  labels:
    app: chat-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
      - name: chat-service
        image: your-registry/chat-service:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: user-service-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          value: redis://redis-service:6379
        - name: KEYCLOAK_URL
          value: http://keycloak:8080
        - name: KEYCLOAK_REALM
          value: app
        - name: KEYCLOAK_CLIENT_ID
          value: user-service
        - name: KEYCLOAK_CLIENT_SECRET 
          valueFrom:
            secretKeyRef:
              name: keycloak-client-secret
              key: user-service-secret
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
