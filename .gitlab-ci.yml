stages:
  - validate

# Future stages
# - build
# - push
# - deploy
# - cleanup

pre-commit:
  stage: validate
  image: 
    name: stangirard/pre-commit-terraform:0.12.29-1
  variables:
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  cache:
    paths:
      - ${PRE_COMMIT_HOME}
  script:
    - echo "Running pre-commit hooks using dedicated image..."
    - pre-commit run --all-files --show-diff-on-failure
  tags: [validation]

yamllint:
  stage: validate
  image: registry.gitlab.com/pipeline-components/yamllint:latest
  script:
    - yamllint .
  tags: [validation]
---
name: Deploy Infrastructure
on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      
      - name: Port Forward Keycloak
        run: |
          kubectl port-forward -n infrastructure svc/keycloak 8080:8080 &
          sleep 10
      
      - name: Terraform Init
        working-directory: terraform
        run: terraform init
      
      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_keycloak_admin_password: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          TF_VAR_user_service_client_secret: ${{ secrets.USER_SERVICE_CLIENT_SECRET }}
        run: terraform apply -auto-approve
