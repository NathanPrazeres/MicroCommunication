---
deployment:
  replicas: 1
  readinessProbe:
    httpGet:
      path: /ping
      port: 9000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

service:
  type: NodePort

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    nodePort: 30080
    protocol: TCP

additionalArguments:
  - "--api.insecure=true"
  - "--ping=true"
  - "--ping.entryPoint=traefik"

api:
  dashboard: true
  insecure: true

ping:
  enabled: true
  entryPoint: traefik 

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.localhost`) || PathPrefix(`/dashboard`) || PathPrefix(`/api`)
    entryPoints:
      - web
    middlewares: []

# Creates a BasiAuth Middleware and Secret for the Dashboard Security

# extraObjects:
