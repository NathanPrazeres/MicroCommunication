#   - apiVersion: traefik.io/v1alpha1
#     kind: Middleware
#     metadata:
#       name: dashboard-auth
#     spec:
#       basicAuth:
#         secret: dashboard-auth-secret

logs:
  general:
    level: INFO
  access:
    enabled: true

metrics:
  prometheus:
    enabled: true
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      honorLabels: true
      additionalLabels:
        release: kube-prometheus-stack

resources:
  requests:
    cpu: 100m
    memory: 50Mi
  limits:
    cpu: 300m
    memory: 150Mi

