---
- name: Create ArgoCD namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd

- name: Download ArgoCD installation manifest
  get_url:
    url: "{{ argocd_manifest_url | default('https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml') }}"
    dest: /tmp/k8s-bootstrap/argocd-install.yaml
    mode: 0644

- name: Install ArgoCD
  kubernetes.core.k8s:
    state: present
    src: /tmp/k8s-bootstrap/argocd-install.yml
    namespace: argocd

- name: Wait for ArgoCD server to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: argocd
    name: argocd-server
  register: argocd_deploy
  until: argocd_deploy.resources | length > 0 and argocd_deploy.resources[0].status.availableReplicas | default(0) > 0
  retries: 10
  delay: 10

- name: Get ArgoCD admin password
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: argocd
    name: argocd-initial-admin-secret
  register: admin_secret
  no_log: true

- name: Decode ArgoCD access information
  debug:
    msg:
      - "ArgoCD has been installed succesfully"
      - "Access it using: kubectl port-forward svc/argocd-server -n argocd 8080:443"
      - "Username: admin"
      - "Password: {{ argocd_admin_password }}"

- name: Deploy ArgoCD Application
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'templates/argocd-app.yaml.j2') }}"


- name: Add private Git repo credentials to ArgoCD
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('file', 'files/argocd-repo-secret.yaml') }}"
