---
- name: Create namespace for GCP CSI driver
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ gcp_csi_namespace }}"
    state: present


- name: Install GCE Persistent Disk CSI Driver
  command: kubectl apply -k "github.com/kubernetes-sigs/gcp-compute-persistent-disk-csi-driver/deploy/kubernetes/overlays/stable"
  register: csi_install
  changed_when: "'created' in csi_install.stdout or 'configured' in csi_install.stdout"

- name: Wait for CSI controller to be ready
  command: kubectl wait --for=condition=available --timeout=300s deployment/csi-gce-pd-controller -n gce-pd-csi-driver
  changed_when: false

- name: Create standard StorageClass
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: standard
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
      provisioner: pd.csi.storage.gke.io
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
      parameters:
        type: pd-ssd
        replication-type: none
