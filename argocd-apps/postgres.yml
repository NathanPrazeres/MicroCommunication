---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    argocd.argoproj.io/managed-by: root
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: postgresql
      targetRevision: 18.1.1
      helm:
        releaseName: postgresql
        valueFiles:
          - $values/k8s-manifests/platform/postgres/values.yml
    - repoURL: git@gitlab.rnl.tecnico.ulisboa.pt:agisit/agisit25-g20.git
      targetRevision: dev
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
