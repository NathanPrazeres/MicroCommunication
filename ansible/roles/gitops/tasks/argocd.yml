#     dest: /tmp/k8s-bootstrap/argocd-install.yaml
#     mode: 0644

- name: Add ArgoCD Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

# - name: Install ArgoCD
#   kubernetes.core.k8s:
#     state: present
#     src: /tmp/k8s-bootstrap/argocd-install.yaml
#     namespace: argocd
#     wait: yes
#     wait_timeout: 300

# - name: Install ArgoCD
#   kubernetes.core.k8s:
#     state: present
#     src: "{{ argocd_install_manifest }}"
#     wait: yes
#     wait_timeout: 300

- name: Install ArgoCD via Helm
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: argocd
    create_namespace: false
    values:
      global:
        domain: argocd.local

      server:
        service:
          type: ClusterIP

      # Helm support is enabled by default in the chart
      repoServer:
        env:
          - name: ARGOCD_EXEC_TIMEOUT
            value: "5m"
    wait: true
    wait_timeout: 10m

- name: Wait for ArgoCD server to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: argocd
    label_selectors:
      - app.kubernetes.io/part-of=argocd
    name: argocd-server
    wait: yes
    wait_condition:
      type: Available
      status: True
    wait_timeout: 600
  register: argocd_deploy
  until: argocd_deploy is succeeded
  retries: 3
  delay: 10

- name: Wait for ArgoCD application controller to be ready
  kubernetes.core.k8s_info:
    kind: Stateful-Set
    name: argocd-application-controller
    namespace: argocd
    wait: yes
    wait_condition:
      type: Available
      status: True
    wait_timeout: 600

- name: Wait for ArgoCD repo server to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    name: argocd-repo-server
    namespace: argocd
    wait: yes
    wait_condition:
      type: Available
      status: True
    wait_timeout: 600

- name: Wait for ArgoCD Application CRD to be available
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: applications.argoproj.io
  register: argocd_crd
  retries: 30
  delay: 5
  until: argocd_crd.resources | length > 0

- name: Get ArgoCD admin password
  kubernetes.core.k8s_info:
    kind: Secret
    name: argocd-initial-admin-secret
    namespace: argocd
  register: argocd_secret
  retries: 10
  delay: 5
  until: argocd_secret.resources | length > 0

- name: Display ArgoCD password for logging
  set_fact:
    argocd_admin_password: "{{ argocd_secret.resources[0].data.password | b64decode }}"
  when: argocd_secret.resources | length > 0

# - name: Add private Git repo credentials to ArgoCD
#   kubernetes.core.k8s:
#     state: present
#     definition: "{{ lookup('file', 'templates/argocd-repo-secret.yaml.j2') }}"

- name: Read SSH private key
  set_fact:
    ssh_private_key: "{{ lookup('file', argocd_repo_ssh_key_path) }}"
  when: argocd_repo_ssh_key_path is defined
  no_log: true

- name: Get GitLab SSH host keys
  shell: ssh-keyscan gitlab.rnl.tecnico.ulisboa.pt
  register: gitlab_host_keys
  changed_when: false

- name: Create/Update ArgoCD SSH known hosts ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-ssh-known-hosts-cm
        namespace: argocd
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        ssh_known_hosts: |
          {{ gitlab_host_keys.stdout }}

- name: Restart ArgoCD repo-server to pick up new known hosts
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    namespace: argocd
    label_selectors:
      - app.kubernetes.io/name=argocd-repo-server
  when: gitlab_host_keys.changed

- name: Wait for repo-server to restart
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: argocd
    label_selectors:
      - app.kubernetes.io/name=argocd-repo-server
    wait: yes
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 120

- name: Create repository secret with SSH key
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: private-repo
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repository
      type: Opaque
      stringData:
        type: git
        url: "git@gitlab.rnl.tecnico.ulisboa.pt:{{ git_repo_org }}/{{ argocd_repo_name }}.git"
        sshPrivateKey: |
          {{ ssh_private_key }}
  when: argocd_repo_ssh_key_path is defined
  no_log: true

- name: Wait for repository to be registered
  pause:
    seconds: 15

- name: Deploy root Application (App of Apps)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: root
        namespace: argocd
        finalizers:
          - resources-finalizer.argocd.argoproj.io
      spec:
        project: default
        source:
          repoURL: "git@gitlab.rnl.tecnico.ulisboa.pt:{{ git_repo_org }}/{{ argocd_repo_name }}.git"
          targetRevision: 4-microservice-structure
          path: "{{ argocd_apps_path | default('argocd-apps') }}"
        destination:
          server: https://kubernetes.default.svc
          namespace: argocd
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

