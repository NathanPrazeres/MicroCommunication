---
global:
  postgresql:
    auth:
      postgresPassword: "admin"  # Change in production!
      username: "admin"
      password: "admin"
      database: "keycloak"

architecture: standalone # replication

primary:
  persistence:
    enabled: false
    # size: 1Gi

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  # Multiple databases
  initdb:
    scripts:
      init-db.sql: |
        -- ==========================================
        -- Chat App Database Schema
        -- Database: user_service
        -- Used by: User Service
        -- ==========================================

        -- Create separate database for user service
        CREATE DATABASE user_service;

        \c user_service;

        -- Enable UUID extension
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";


        -- ==========================================
        -- USER PROFILE TABLES
        -- ==========================================

        -- User profiles - extended user information
        CREATE TABLE user_profiles (
            user_id UUID PRIMARY KEY,
            username VARCHAR(20) NOT NULL,
            email VARCHAR(50) NOT NULL,
            first_name VARCHAR(100) NOT NULL,
            last_name VARCHAR(100) NOT NULL,
            bio TEXT,
            avatar_url VARCHAR(500),
            phone_number VARCHAR(20),
            is_online BOOLEAN NOT NULL DEFAULT FALSE,
            last_seen TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
            created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
            deleted BOOLEAN NOT NULL DEFAULT FALSE,

            CONSTRAINT first_name_length CHECK (char_length(first_name) >= 1),
            CONSTRAINT last_name_length CHECK (char_length(last_name) >= 1)
        );

        CREATE INDEX idx_user_profiles_username ON user_profiles(username);

        -- User preferences - good for UX/UI
        CREATE TABLE user_preferences (
            user_id UUID PRIMARY KEY REFERENCES user_profiles(user_id) ON DELETE CASCADE,
            theme VARCHAR(20) DEFAULT 'light',
            notifications_enabled BOOLEAN NOT NULL DEFAULT TRUE,
            read_receipts_enabled BOOLEAN NOT NULL DEFAULT TRUE,
            online_status_visible BOOLEAN NOT NULL DEFAULT TRUE,
            language VARCHAR(10) NOT NULL DEFAULT 'en',
            updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
        );

        -- Contacts/Friends - user relationships
        CREATE TABLE user_contacts (
            user_id UUID REFERENCES user_profiles(user_id) ON DELETE CASCADE,
            contact_id UUID REFERENCES user_profiles(user_id) ON DELETE CASCADE,
            nickname VARCHAR(100),  -- Optional custom name for contact
            is_favorite BOOLEAN NOT NULL DEFAULT FALSE,
            is_blocked BOOLEAN NOT NULL DEFAULT FALSE,
            created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
            deleted BOOLEAN NOT NULL DEFAULT FALSE,

            PRIMARY KEY (user_id, contact_id),
            CONSTRAINT no_self_contact CHECK (user_id != contact_id)
        );

        CREATE INDEX idx_contacts_user_id ON user_contacts(user_id);
        CREATE INDEX idx_contacts_contact_id ON user_contacts(contact_id);


        -- ==========================================
        -- FUNCTIONS & TRIGGERS
        -- ==========================================

        -- Auto-update updated_at timestamp
        CREATE OR REPLACE FUNCTION update_updated_at_column()
        RETURNS TRIGGER AS $$
        BEGIN
            NEW.updated_at = NOW();
            RETURN NEW;
        END;
        $$ language 'plpgsql';

        CREATE TRIGGER update_user_profiles_updated_at BEFORE UPDATE ON user_profiles
            FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

        -- Auto-create user_profile when user is created
        CREATE OR REPLACE FUNCTION create_user_preferences()
        RETURNS TRIGGER AS $$
        BEGIN
            INSERT INTO user_preferences (user_id)
            VALUES (NEW.user_id);
            RETURN NEW;
        END;
        $$ language 'plpgsql';

        CREATE TRIGGER auto_create_user_preferences AFTER INSERT ON user_profiles
            FOR EACH ROW EXECUTE FUNCTION create_user_preferences();

        -- ==========================================
        -- Chat App Database Schema
        -- Database: chat_service
        -- Used by: Chat Service
        -- ==========================================
        CREATE DATABASE chat_service;

        \c chat_service

        -- Enable UUID extension
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

        -- ==========================================
        -- CHAT TABLES
        -- ==========================================

        -- Chat rooms/conversations
        CREATE TABLE IF NOT EXISTS rooms (
            id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
            name VARCHAR(100),  -- NULL for direct messages
            description TEXT,
            room_type VARCHAR(20) NOT NULL,  -- 'direct', 'group', 'channel'
            created_by UUID,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),

            CONSTRAINT valid_room_type CHECK (room_type IN ('direct', 'group', 'channel'))
        );

        CREATE INDEX IF NOT EXISTS idx_rooms_type ON rooms(room_type);
        CREATE INDEX IF NOT EXISTS idx_rooms_created_by ON rooms(created_by);

        -- Room participants
        CREATE TABLE IF NOT EXISTS room_participants (
            room_id UUID REFERENCES rooms(id) ON DELETE CASCADE,
            user_id UUID,
            role VARCHAR(20) DEFAULT 'member',  -- 'owner', 'admin', 'member'
            joined_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            last_read_at TIMESTAMP WITH TIME ZONE,
            PRIMARY KEY (room_id, user_id),
            CONSTRAINT valid_role CHECK (role IN ('owner', 'admin', 'member'))
        );

        CREATE INDEX IF NOT EXISTS idx_room_participants_user_id ON room_participants(user_id);
        CREATE INDEX IF NOT EXISTS idx_room_participants_room_id ON room_participants(room_id);

        -- Messages
        CREATE TABLE IF NOT EXISTS messages (
            id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
            room_id UUID REFERENCES rooms(id) ON DELETE CASCADE,
            sender_id UUID,
            content TEXT NOT NULL,
            message_type VARCHAR(20) DEFAULT 'text',
            reply_to_id UUID REFERENCES messages(id) ON DELETE SET NULL,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE,
            deleted_at TIMESTAMP WITH TIME ZONE,
            CONSTRAINT valid_message_type CHECK (message_type IN ('text', 'image', 'file', 'system')),
            CONSTRAINT content_not_empty CHECK (char_length(content) > 0)
        );

        CREATE INDEX IF NOT EXISTS idx_messages_room_id ON messages(room_id, created_at DESC);
        CREATE INDEX IF NOT EXISTS idx_messages_sender_id ON messages(sender_id);
        CREATE INDEX IF NOT EXISTS idx_messages_created_at ON messages(created_at DESC);

        -- Message read receipts
        CREATE TABLE IF NOT EXISTS message_reads (
            message_id UUID REFERENCES messages(id) ON DELETE CASCADE,
            user_id UUID,
            read_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            PRIMARY KEY (message_id, user_id)
        );

        CREATE INDEX IF NOT EXISTS idx_message_reads_user_id ON message_reads(user_id);

        -- ==========================================
        -- FUNCTIONS & TRIGGERS
        -- ==========================================

        -- Auto-update updated_at timestamp
        CREATE OR REPLACE FUNCTION update_updated_at_column()
        RETURNS TRIGGER AS $$
        BEGIN
            NEW.updated_at = NOW();
            RETURN NEW;
        END;
        $$ LANGUAGE plpgsql;

        DROP TRIGGER IF EXISTS update_rooms_updated_at ON rooms;
        CREATE TRIGGER update_rooms_updated_at BEFORE UPDATE ON rooms
            FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

# This section configures your replicated nodes for HA.
# replica:
#   replicaCount: 2
#
#   # IMPORTANT: Replicas should NOT use persistent storage 
#   # for the data directory, as they receive data via streaming replication.
#   persistence:
#     enabled: false
#
#   resources:
#     requests:
#       memory: 256Mi
#       cpu: 250m
#     limits:
#       memory: 512Mi
#       cpu: 500m

image:
  registry: docker.io
  repository: bitnami/postgresql
  tag: "latest"

# Metrics for Prometheus
metrics:
  enabled: true
  entryPoint: metrics
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: kube-prometheus-stack

backup:
  enabled: false
