---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    argocd.argoproj.io/managed-by: root
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@gitlab.rnl.tecnico.ulisboa.pt:agisit/agisit25-g20.git
    targetRevision: dev
    path: k8s-manifests/app
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
