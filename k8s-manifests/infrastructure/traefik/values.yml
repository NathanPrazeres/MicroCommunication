---
deployment:
  replicas: 1
  readinessProbe:
    httpGet:
      path: /ping
      port: 9000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

service:
  type: NodePort

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    nodePort: 30080
    protocol: TCP

  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    nodePort: 30443
    protocol: TCP
    tls:
      enabled: true

# Secret gets created dynamically
tlsStore:
  default:
    defaultCertificate:
      secretName: traefik-tls

additionalArguments:
  - "--api.insecure=true"
  - "--ping=true"
  - "--ping.entryPoint=traefik"

api:
  dashboard: true
  insecure: true

ping:
  enabled: true
  entryPoint: traefik 

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.localhost`) || PathPrefix(`/dashboard`) || PathPrefix(`/api`)
    entryPoints:
      - web
    middlewares: []

logs:
  general:
    level: INFO
  access:
    enabled: true

metrics:
  prometheus:
    enabled: true
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      honorLabels: true
      additionalLabels:
        release: kube-prometheus-stack

resources:
  requests:
    cpu: 100m
    memory: 50Mi
  limits:
    cpu: 300m
    memory: 150Mi

