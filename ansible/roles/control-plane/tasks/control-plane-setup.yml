---
- name: Create the directory for the kubernetes_config_file
  file:
    path: "{{ kubernetes_config_file_path | dirname }}"
    state: directory
    mode: 0755

- name: Deploy the config-file for kubeadm and kubelet
  template:
    src: "config-file.j2"
    dest: "{{ kubernetes_config_file_path }}"
    mode: 0644

- name: Initialize Kubernetes control plane with kubeadm init
  command: >
    kubeadm init
    --config {{ kubernetes_config_file_path }}
    {{ kubernetes_kubeadm_init_extra_opts }}
  register: kubeadmin_init
  when: (not kubernetes_init_stat.stat.exists) and (kubernetes_ignore_preflight_errors is not defined)

- name: Initialize Kubernetes control plane with kubeadm init and ignore_preflight_errors
  command: >
    kubeadm init
    --config {{ kubernetes_config_file_path }}
    --ignore-preflight-errors={{ kubernetes_ignore_preflight_errors }}
    {{ kubernetes_kubeadm_init_extra_opts }}
  register: kubeadmin_init
  when: (not kubernetes_init_stat.stat.exists) and (kubernetes_ignore_preflight_errors is defined)

- name: Print the init output to screen.
  debug:
    var: kubeadmin_init.stdout
    verbosity: 2
  when: not kubernetes_init_stat.stat.exists

- name: Ensure .kube directory exists for current user
  file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    mode: 0755
    owner: "{{ ansible_user }}"

- name: Ensure .kube directory exists for root
  file:
    path: "/root/.kube"
    state: directory
    mode: 0755
    owner: "root"

- name: Copy kubeconfig to debian’s home
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "debian"
    mode: 0600

- name: Copy kubeconfig to root
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/root/.kube/config"
    remote_src: true

- name: Wait for kube-apiserver to respond
  command: kubectl cluster-info
  register: cluster_info
  until: cluster_info.rc == 0
  retries: 20
  delay: 6
  changed_when: false

### CNI SETUP
- name: Configure Calico networking
  command: "kubectl apply -f {{ kubernetes_calico_manifest_file }}"
  register: calico_result
  changed_when: "'created' in calico_result.stdout or 'configured' in calico_result.stdout"
  when: kubernetes_pod_network.cni == 'calico'
  until: calico_result is not failed
  retries: 12
  delay: 5

- name: Configure Flannel networking
  command: "kubectl apply -f {{ kubernetes_flannel_manifest_file }}"
  register: flannel_result
  changed_when: "'created' in flannel_result.stdout or 'configured' in flannel_result.stdout"
  when: kubernetes_pod_network.cni == 'flannel'
  until: flannel_result is not failed
  retries: 12
  delay: 5

- name: Get Kubernetes version for Weave installation
  shell: kubectl version | base64 | tr -d '\n'
  changed_when: false
  register: kubectl_version
  when: kubernetes_pod_network.cni == 'weave'
  until: kubectl_version is not failed
  retries: 12
  delay: 5

- name: Configure Weave networking
  command: "kubectl apply -f https://cloud.weave.works/k8s/net?k8s-version={{ kubectl_version.stdout_lines[0] }}"
  register: weave_result
  changed_when: "'created' in weave_result.stdout or 'configured' in weave_result.stdout"
  when: kubernetes_pod_network.cni == 'weave'
  until: weave_result is not failed
  retries: 12
  delay: 5

#####

- name: Wait for all nodes to be ready
  command: kubectl get nodes
  register: nodes_ready
  until: "'NotReady' not in nodes_ready.stdout"
  retries: 20
  delay: 10
  changed_when: false
