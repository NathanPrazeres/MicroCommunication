---
- include_tasks: setup.yml

- name: Install Kubernetes packages
  package:
    name: "{{ kubernetes_packages }}"
    state: "{{ kubernetes_packages_state }}"
  notify: restart kubelet
  with_items: "{{ kubernetes_packages }}"

- include_tasks: sysctl-setup.yml

- name: Ensure kubelet is started and enabled at boot.
  service:
    name: kubelet
    state: started
    enabled: true

- name: Check if worker already joined
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: worker_joined

- name: Join the node to the cluster
  command: "{{ hostvars[groups['control_plane'][0]].kubeadm_join_command }}"
  when: not worker_joined.stat.exists
