---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: app
  labels:
    app: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-metrics
  namespace: app
  labels:
    app: keycloak
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9000
      targetPort: 9000
      protocol: TCP
  selector:
    app: keycloak

